name: EMS Platform Build (Core + Client + Nebulous Plugin)

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
      - "r*"
      - "test"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/imu-iccs
  CORE_VERSION: 8.0.0-snapshot
  NEBULOUS_VERSION: 1.1.0-snapshot

jobs:

  # ---------------------------------------------------
  # 1. Ensure core images exist (fast check only)
  # ---------------------------------------------------
  preflight:
    runs-on: ubuntu-latest

    outputs:
      core_version: ${{ env.CORE_VERSION }}

    steps:
      - name: Check core availability in GHCR
        id: check
        run: |
          set -e

          IMAGE="${REGISTRY}/ems-server:${CORE_VERSION}"

          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Core image exists: $IMAGE"
          else
            echo "ERROR: Core image not found: $IMAGE"
            exit 1
          fi

  # ---------------------------------------------------
  # 2. Build plugin image (multi-arch, no QEMU)
  # ---------------------------------------------------
  build-plugin:
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------
      # Build plugin using prebuilt core images
      # ---------------------------------------------------
      - id: metadata
        run: |
          COMMIT_DATE=$(git show -s --format=%cI HEAD)
          SAFE_TIME=$(date -u -d "$COMMIT_DATE" +"%Y%m%dT%H%M%SZ")
          echo "safe_time=$SAFE_TIME" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------
      # Build plugin using prebuilt core images
      # ---------------------------------------------------
      - name: Build and push Nebulous plugin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          cache-from: type=gha
          cache-to: type=gha,mode=max

          build-contexts: |
            ems_core_image=docker-image://${{ env.REGISTRY }}/ems-server:${{ env.CORE_VERSION }}
            ems_core_builder_image=docker-image://${{ env.REGISTRY }}/ems-server-core-builder:latest

          tags: |
            ${{ env.REGISTRY }}/ems-server-nebulous:${{ env.NEBULOUS_VERSION }}
            ${{ env.REGISTRY }}/ems-server-nebulous:latest
            ${{ env.REGISTRY }}/ems-server-nebulous:${{ github.sha }}
            ${{ env.REGISTRY }}/ems-server-nebulous:${{ github.sha }}-${{ steps.metadata.outputs.safe_time }}